let camera,scene,renderer,controls;const objects=[];const targets={table:[],sphere:[],helix:[],grid:[]};const colors=['rgba(0,255,255,','rgba(147,112,219,','rgba(255,105,180,','rgba(50,205,50,','rgba(255,215,0,'];init();animate();
function init(){camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,1,10000);camera.position.z=3000;scene=new THREE.Scene();for(let i=0;i<table.length;i+=5){const element=document.createElement('div');element.className='element';const colorBase=colors[Math.floor(Math.random()*colors.length)];element.style.boxShadow=`0 0 12px ${colorBase}0.5)`;element.style.border=`1px solid ${colorBase}0.25)`;element.addEventListener('mouseenter',()=>{element.style.boxShadow=`0 0 25px ${colorBase}0.9)`;element.style.border=`1px solid ${colorBase}0.75)`});element.addEventListener('mouseleave',()=>{element.style.boxShadow=`0 0 12px ${colorBase}0.5)`;element.style.border=`1px solid ${colorBase}0.25)`});const number=document.createElement('div');number.className='number';number.textContent=i/5+1;element.appendChild(number);const symbol=document.createElement('div');symbol.className='symbol';symbol.textContent=table[i];element.appendChild(symbol);const details=document.createElement('div');details.className='details';details.innerHTML=table[i+1]+'<br>'+table[i+2];element.appendChild(details);const objectCSS=new CSS3DObject(element);objectCSS.position.set(Math.random()*4000-2000,Math.random()*4000-2000,Math.random()*4000-2000);scene.add(objectCSS);objects.push(objectCSS);const objectTable=new THREE.Object3D();objectTable.position.x=table[i+3]*140-1330;objectTable.position.y=-(table[i+4]*180)+990;targets.table.push(objectTable)}const vector=new THREE.Vector3();for(let i=0,l=objects.length;i<l;i++){const phi=Math.acos(-1+2*i/l),theta=Math.sqrt(l*Math.PI)*phi,objectSphere=new THREE.Object3D();objectSphere.position.setFromSphericalCoords(800,phi,theta);vector.copy(objectSphere.position).multiplyScalar(2);objectSphere.lookAt(vector);targets.sphere.push(objectSphere)}for(let i=0,l=objects.length;i<l;i++){const theta=i*.175+Math.PI,y=-(i*8)+450,objectHelix=new THREE.Object3D();objectHelix.position.setFromCylindricalCoords(900,theta,y);vector.set(objectHelix.position.x*2,objectHelix.position.y,objectHelix.position.z*2);objectHelix.lookAt(vector);targets.helix.push(objectHelix)}for(let i=0;i<objects.length;i++){const objectGrid=new THREE.Object3D();objectGrid.position.set(i%5*400-800,-(Math.floor(i/5)%5)*400+800,Math.floor(i/25)*1000-2000);targets.grid.push(objectGrid)}renderer=new CSS3DRenderer();renderer.setSize(innerWidth,innerHeight);document.getElementById('container').appendChild(renderer.domElement);controls=new TrackballControls(camera,renderer.domElement);controls.minDistance=500;controls.maxDistance=6000;controls.addEventListener('change',render);document.getElementById('table').addEventListener('click',()=>transform(targets.table,2000));document.getElementById('sphere').addEventListener('click',()=>transform(targets.sphere,2000));document.getElementById('helix').addEventListener('click',()=>transform(targets.helix,2000));document.getElementById('grid').addEventListener('click',()=>transform(targets.grid,2000));transform(targets.table,2000);addEventListener('resize',onWindowResize)}
function transform(targets,duration){TWEEN.removeAll();objects.forEach((object,i)=>{const target=targets[i];new TWEEN.Tween(object.position).to({x:target.position.x,y:target.position.y,z:target.position.z},Math.random()*duration+duration).easing(TWEEN.Easing.Exponential.InOut).start();new TWEEN.Tween(object.rotation).to({x:target.rotation.x,y:target.rotation.y,z:target.rotation.z},Math.random()*duration+duration).easing(TWEEN.Easing.Exponential.InOut).start()});new TWEEN.Tween(this).to({},duration*2).onUpdate(render).start()}
