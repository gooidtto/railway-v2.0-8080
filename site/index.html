<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02070d">
<title>3D 元素周期表 · 多种动态效果</title>
<style>
:root{--cyan:#7fffff;--bg:#02070d;--panel:rgba(2,18,30,.72);--line:rgba(127,255,255,.24)}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:radial-gradient(circle at 50% 45%,#0b1e32 0,#030a12 46%,#010307 100%);color:#fff;font-family:Inter,"Helvetica Neue",Arial,sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(rgba(127,255,255,.34) .7px,transparent .8px);background-size:46px 46px;opacity:.12}
#header{position:fixed;top:22px;left:0;right:0;text-align:center;z-index:20;pointer-events:none}.title{margin:0;font-size:clamp(21px,3vw,34px);font-weight:300;letter-spacing:clamp(2px,.45vw,5px);text-shadow:0 0 22px rgba(0,255,255,.72)}.sub{margin:7px 0 0;color:#8bb9c7;font-size:12px;letter-spacing:2px}
#scene{position:absolute;inset:0;perspective:1800px;perspective-origin:50% 48%;touch-action:none}#world{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;will-change:transform}
.card{position:absolute;width:116px;height:150px;margin:-75px 0 0 -58px;border:1px solid var(--line);border-radius:6px;background:linear-gradient(145deg,rgba(0,35,55,.76),rgba(0,9,18,.68));box-shadow:0 0 10px rgba(0,255,255,.25),inset 0 0 20px rgba(0,255,255,.035);backdrop-filter:blur(3px);transform-style:preserve-3d;transition:transform 900ms cubic-bezier(.2,.8,.2,1),opacity .35s,box-shadow .2s,border-color .2s;cursor:pointer;user-select:none}
.card:hover{z-index:50;border-color:rgba(127,255,255,.9);box-shadow:0 0 24px rgba(0,255,255,.75),inset 0 0 18px rgba(0,255,255,.08)}.num{position:absolute;right:9px;top:8px;color:rgba(127,255,255,.72);font-size:11px}.sym{position:absolute;left:0;right:0;top:37px;text-align:center;font-size:45px;font-weight:700;letter-spacing:-1px;text-shadow:0 0 12px rgba(0,255,255,.5)}.name{position:absolute;left:5px;right:5px;bottom:26px;text-align:center;color:#a8d6df;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mass{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:rgba(127,255,255,.58);font-size:9px}
#hud{position:fixed;left:18px;top:88px;z-index:30;padding:10px 13px;border:1px solid rgba(127,255,255,.16);border-radius:6px;background:rgba(0,8,15,.42);backdrop-filter:blur(8px);font-size:10px;line-height:1.7;color:#7ca4af}.status{color:var(--cyan)}
#menu{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:40;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:min(94vw,980px)}button{appearance:none;border:1px solid rgba(127,255,255,.48);border-radius:5px;background:rgba(0,16,26,.72);color:rgba(185,255,255,.86);padding:9px 15px;font-size:11px;letter-spacing:1px;cursor:pointer;backdrop-filter:blur(7px);transition:.2s}button:hover,button.active{color:#fff;border-color:#7fffff;background:rgba(0,70,90,.35);box-shadow:0 0 16px rgba(0,255,255,.3)}
#detail{position:fixed;right:18px;top:88px;width:180px;z-index:30;padding:12px 14px;border:1px solid rgba(127,255,255,.16);border-radius:6px;background:rgba(0,8,15,.5);backdrop-filter:blur(8px);font-size:11px;line-height:1.65;color:#83aeb8;opacity:0;transform:translateY(-6px);transition:.2s;pointer-events:none}.detail-on{opacity:1!important;transform:none!important}.detail-symbol{font-size:28px;color:#fff;text-shadow:0 0 12px rgba(0,255,255,.7)}
@media(max-width:700px){#header{top:14px}.sub{font-size:9px;letter-spacing:1px}.card{width:76px;height:102px;margin:-51px 0 0 -38px}.sym{top:24px;font-size:31px}.num{top:6px;right:6px;font-size:8px}.name{bottom:19px;font-size:7px}.mass{bottom:7px;font-size:7px}#hud{display:none}#detail{right:10px;top:58px;width:140px;font-size:9px}.detail-symbol{font-size:22px}#menu{bottom:12px;gap:5px}button{padding:7px 9px;font-size:9px}}
@media(prefers-reduced-motion:reduce){.card{transition:none!important}button{transition:none!important}}
</style>
</head>
<body>
<header id="header"><h1 class="title">3D 元素周期表 · 多种动态效果</h1><p class="sub">Interactive 3D Periodic Table · Multiple Dynamic Styles</p></header>
<div id="hud">模式：<span class="status" id="modeText">表面</span><br>118 种元素 · 本地渲染<br>拖拽旋转 · 滚轮缩放 · 悬停查看</div>
<div id="detail"></div><main id="scene"><div id="world"></div></main>
<nav id="menu" aria-label="视觉模式"><button data-mode="table" class="active">表面</button><button data-mode="sphere">球体</button><button data-mode="helix">螺旋</button><button data-mode="grid">网格</button></nav>
<script>
(function(){
'use strict';
const data=[
['H','Hydrogen','1.008',1,1],['He','Helium','4.003',18,1],['Li','Lithium','6.941',1,2],['Be','Beryllium','9.012',2,2],['B','Boron','10.81',13,2],['C','Carbon','12.01',14,2],['N','Nitrogen','14.01',15,2],['O','Oxygen','16.00',16,2],['F','Fluorine','19.00',17,2],['Ne','Neon','20.18',18,2],['Na','Sodium','22.99',1,3],['Mg','Magnesium','24.31',2,3],['Al','Aluminium','26.98',13,3],['Si','Silicon','28.09',14,3],['P','Phosphorus','30.97',15,3],['S','Sulfur','32.06',16,3],['Cl','Chlorine','35.45',17,3],['Ar','Argon','39.95',18,3],['K','Potassium','39.10',1,4],['Ca','Calcium','40.08',2,4],['Sc','Scandium','44.96',3,4],['Ti','Titanium','47.87',4,4],['V','Vanadium','50.94',5,4],['Cr','Chromium','52.00',6,4],['Mn','Manganese','54.94',7,4],['Fe','Iron','55.85',8,4],['Co','Cobalt','58.93',9,4],['Ni','Nickel','58.69',10,4],['Cu','Copper','63.55',11,4],['Zn','Zinc','65.38',12,4],['Ga','Gallium','69.72',13,4],['Ge','Germanium','72.63',14,4],['As','Arsenic','74.92',15,4],['Se','Selenium','78.97',16,4],['Br','Bromine','79.90',17,4],['Kr','Krypton','83.80',18,4],['Rb','Rubidium','85.47',1,5],['Sr','Strontium','87.62',2,5],['Y','Yttrium','88.91',3,5],['Zr','Zirconium','91.22',4,5],['Nb','Niobium','92.91',5,5],['Mo','Molybdenum','95.95',6,5],['Tc','Technetium','98',7,5],['Ru','Ruthenium','101.1',8,5],['Rh','Rhodium','102.9',9,5],['Pd','Palladium','106.4',10,5],['Ag','Silver','107.9',11,5],['Cd','Cadmium','112.4',12,5],['In','Indium','114.8',13,5],['Sn','Tin','118.7',14,5],['Sb','Antimony','121.8',15,5],['Te','Tellurium','127.6',16,5],['I','Iodine','126.9',17,5],['Xe','Xenon','131.3',18,5],['Cs','Caesium','132.9',1,6],['Ba','Barium','137.3',2,6],['La','Lanthanum','138.9',3,6],['Ce','Cerium','140.1',4,6],['Pr','Praseodymium','140.9',5,6],['Nd','Neodymium','144.2',6,6],['Pm','Promethium','145',7,6],['Sm','Samarium','150.4',8,6],['Eu','Europium','152.0',9,6],['Gd','Gadolinium','157.3',10,6],['Tb','Terbium','158.9',11,6],['Dy','Dysprosium','162.5',12,6],['Ho','Holmium','164.9',13,6],['Er','Erbium','167.3',14,6],['Tm','Thulium','168.9',15,6],['Yb','Ytterbium','173.0',16,6],['Lu','Lutetium','175.0',17,6],['Hf','Hafnium','178.5',4,6],['Ta','Tantalum','180.9',5,6],['W','Tungsten','183.8',6,6],['Re','Rhenium','186.2',7,6],['Os','Osmium','190.2',8,6],['Ir','Iridium','192.2',9,6],['Pt','Platinum','195.1',10,6],['Au','Gold','197.0',11,6],['Hg','Mercury','200.6',12,6],['Tl','Thallium','204.4',13,6],['Pb','Lead','207.2',14,6],['Bi','Bismuth','209.0',15,6],['Po','Polonium','209',16,6],['At','Astatine','210',17,6],['Rn','Radon','222',18,6],['Fr','Francium','223',1,7],['Ra','Radium','226',2,7],['Ac','Actinium','227',3,7],['Th','Thorium','232.0',4,7],['Pa','Protactinium','231.0',5,7],['U','Uranium','238.0',6,7],['Np','Neptunium','237',7,7],['Pu','Plutonium','244',8,7],['Am','Americium','243',9,7],['Cm','Curium','247',10,7],['Bk','Berkelium','247',11,7],['Cf','Californium','251',12,7],['Es','Einsteinium','252',13,7],['Fm','Fermium','257',14,7],['Md','Mendelevium','258',15,7],['No','Nobelium','259',16,7],['Lr','Lawrencium','262',17,7],['Rf','Rutherfordium','267',4,7],['Db','Dubnium','268',5,7],['Sg','Seaborgium','271',6,7],['Bh','Bohrium','272',7,7],['Hs','Hassium','270',8,7],['Mt','Meitnerium','276',9,7],['Ds','Darmstadtium','281',10,7],['Rg','Roentgenium','280',11,7],['Cn','Copernicium','285',12,7],['Nh','Nihonium','284',13,7],['Fl','Flerovium','289',14,7],['Mc','Moscovium','288',15,7],['Lv','Livermorium','293',16,7],['Ts','Tennessine','294',17,7],['Og','Oganesson','294',18,7]
];
const world=document.getElementById('world'),detail=document.getElementById('detail'),modeText=document.getElementById('modeText');
const cards=[];let mode='table',rx=-10,ry=0,zoom=1,drag=false,lastX=0,lastY=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function make(){data.forEach((d,i)=>{const el=document.createElement('article');el.className='card';el.innerHTML='<span class="num">'+(i+1)+'</span><div class="sym">'+d[0]+'</div><div class="name">'+d[1]+'</div><div class="mass">'+d[2]+'</div>';el.addEventListener('mouseenter',()=>showDetail(d,i));el.addEventListener('mouseleave',hideDetail);el.addEventListener('click',()=>showDetail(d,i));world.appendChild(el);cards.push(el);});layout('table',false)}
function tablePos(d){return{x:(d[3]-9.5)*132,y:(3.8-d[4])*170,z:d[4]===1||d[4]===2||d[4]===3?0:Math.min(500,(d[3]-1)*8)}}
function spherePos(i,n){const phi=Math.acos(-1+2*i/n),theta=Math.sqrt(n*Math.PI)*phi,r=780;return{x:r*Math.sin(phi)*Math.cos(theta),y:r*Math.cos(phi),z:r*Math.sin(phi)*Math.sin(theta)}}
function helixPos(i,n){const t=i/(n-1),a=t*Math.PI*10,r=720,y=(.5-t)*1800;return{x:r*Math.cos(a),y:y,z:r*Math.sin(a)}}
function gridPos(i){const cols=6,rows=Math.ceil(data.length/cols);return{x:(i%cols-(cols-1)/2)*300,y:(Math.floor(i/cols)-(rows-1)/2)*190,z:((i%3)-1)*180}}
function pos(d,i){if(mode==='table')return tablePos(d);if(mode==='sphere')return spherePos(i,data.length);if(mode==='helix')return helixPos(i,data.length);return gridPos(i)}
function layout(next,animate){mode=next;modeText.textContent={table:'表面',sphere:'球体',helix:'螺旋',grid:'网格'}[mode];document.querySelectorAll('#menu button').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));cards.forEach((el,i)=>{const p=pos(data[i],i);el.style.transform='translate3d('+p.x+'px,'+p.y+'px,'+p.z+'px)';el.style.opacity='1'});if(!animate)requestAnimationFrame(()=>{});}
function showDetail(d,i){detail.innerHTML='<div class="detail-symbol">'+d[0]+'</div><b>'+d[1]+'</b><br>Atomic number: '+(i+1)+'<br>Atomic mass: '+d[2];detail.classList.add('detail-on')}
function hideDetail(){detail.classList.remove('detail-on')}
function applyWorld(){world.style.transform='translate3d(0,0,'+(zoom*0)+'px) rotateX('+rx+'deg) rotateY('+ry+'deg) scale('+zoom+')'}
document.querySelectorAll('#menu button').forEach(b=>b.addEventListener('click',()=>layout(b.dataset.mode,true)));
world.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;world.setPointerCapture(e.pointerId)});world.addEventListener('pointermove',e=>{if(!drag)return;ry+=(e.clientX-lastX)*.32;rx-=(e.clientY-lastY)*.24;lastX=e.clientX;lastY=e.clientY;applyWorld()});world.addEventListener('pointerup',()=>drag=false);world.addEventListener('pointercancel',()=>drag=false);
window.addEventListener('wheel',e=>{zoom=clamp(zoom*(e.deltaY>0?.92:1.08),.48,1.55);applyWorld()},{passive:true});window.addEventListener('resize',applyWorld);make();applyWorld();
})();
</script>
</body>
</html>
